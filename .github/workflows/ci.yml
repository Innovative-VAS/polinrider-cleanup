name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Unit tests (hardened)
        run: npm run test:hardened

  bundle:
    # The committed dist/ci.mjs is what the action runs (no install step at
    # action runtime), so it must always match src/. Rebuild and fail on drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Rebuild action bundle
        run: npm run build:action
      - name: Verify dist/ is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is stale. Run 'npm run build:action' and commit the result."
            git --no-pager diff -- dist/
            exit 1
          fi

  smoke:
    # Prove the published action actually boots and runs in a runner. We can't
    # scan this repo itself — it legitimately contains malware signatures
    # (src/signatures.js) and payload fixtures (test/helpers.js), which the
    # scanner would (correctly) flag. So scan a known-clean throwaway dir and
    # expect a clean, exit-0 result.
    runs-on: ubuntu-latest
    needs: bundle
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a clean fixture
        run: |
          mkdir -p _smoke
          printf 'export default { ok: true };\n' > _smoke/app.js
      - name: Action boots and reports clean
        uses: ./
        with:
          mode: check
          path: _smoke
          comment-on-pr: false
